<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background - warm terracotta, full square for favicon -->
  <rect width="512" height="512" rx="80" ry="80" fill="#E8673A"/>

  <!-- House body - fills most of the space -->
  <rect x="64" y="272" width="384" height="210" rx="12" fill="#FDF0E0"/>

  <!-- Roof - wide and tall -->
  <polygon points="256,48 40,284 472,284" fill="#F5A623"/>

  <!-- Chimney -->
  <rect x="330" y="80" width="44" height="90" rx="6" fill="#F5A623"/>

  <!-- Door - centered, tall -->
  <rect x="196" y="352" width="120" height="130" rx="10" fill="#C0531A"/>

  <!-- Euro sign -->
  <text x="256" y="462"
        font-family="Georgia, serif"
        font-size="108"
        font-weight="bold"
        fill="#FDF0E0"
        text-anchor="middle">€</text>
</svg>
